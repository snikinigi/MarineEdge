name: history
on:
  workflow_run:
    workflows: [collect]
    types: [completed]
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Tick once, on the first run, to rebuild history from earlier data updates'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: history
  cancel-in-progress: false
jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Self-test (nothing is saved if this fails)
        run: node --test
      - name: Rebuild from earlier data updates (one time)
        if: ${{ inputs.backfill }}
        run: |
          git fetch --unshallow || true
          node history.mjs --backfill-git
      - name: Record history
        if: ${{ !inputs.backfill }}
        run: node history.mjs
      - name: Save data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/history data/voyages.json
          git diff --cached --quiet && exit 0
          git commit -m "history update"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
