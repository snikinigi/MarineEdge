# Checks the internal tool (Task 5 onwards): backend tests, frontend build, and the whole
# docker-compose stack starting with a working health check. Runs when backend/, frontend/ or
# docker-compose.yml change, and on demand from the Actions tab. It never touches the public site.
name: backend-tests

on:
  push:
    branches: ['main']
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install and run the unit tests
        working-directory: backend
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt
          python -m pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Install
        working-directory: frontend
        run: npm install --no-audit --no-fund
      # Same as the public deploy: type errors show as a warning, the build itself must pass.
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
        continue-on-error: true
      - name: Build
        working-directory: frontend
        run: npx vite build

  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Start everything (one command)
        run: docker compose up -d --build
      - name: Wait for the health check
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health > /tmp/health.json; then break; fi
            sleep 3
          done
          cat /tmp/health.json
          python3 -c "import json; d = json.load(open('/tmp/health.json')); assert d['status'] == 'ok' and d['postgis'], d"
      - name: Wait for the frontend
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/ -o /tmp/frontend.html && grep -q MarineEdge /tmp/frontend.html; then exit 0; fi
            sleep 3
          done
          echo "frontend did not answer"
          exit 1
      - name: Show logs if something failed
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Stop
        if: always()
        run: docker compose down -v
