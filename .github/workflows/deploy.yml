# Builds the React app and publishes it to GitHub Pages.
# Runs when code is pushed to main, after each data collection (so the map stays
# live), and on demand from the Actions tab.
name: deploy

on:
  push:
    branches: ['main']
  workflow_run:
    workflows: [collect]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      # Type errors show up as a warning in the log but do not block the deploy.
      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: true
      - name: Build
        run: npx vite build
      # The build ships an old copy of the data from public/data. Replace it with
      # the file the collector keeps up to date.
      - name: Use the latest collected data
        run: |
          mkdir -p dist/data
          cp data/ships.json dist/data/ships.json
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
